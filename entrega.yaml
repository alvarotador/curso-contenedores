apiVersion: v1
kind: Namespace
metadata:
  name: ns-alvaro-ulloa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-alvaro-ulloa
  namespace: ns-alvaro-ulloa
data:
  AMBIENTE: "produccion"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-alvaro-ulloa
  namespace: ns-alvaro-ulloa
type: Opaque
stringData:
  API_KEY: "RD2rlq9IZNpMlPlGnwg9dKVf2KVGXasf"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-alvaro-ulloa
  namespace: ns-alvaro-ulloa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-alvaro-ulloa
  template:
    metadata:
      labels:
        app: app-alvaro-ulloa
    spec:
      containers:
      - name: nestjs-app
        image: alvarotador/tarea-final:alvaro-ulloa
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: AMBIENTE
          valueFrom:
            configMapKeyRef:
              name: config-alvaro-ulloa
              key: AMBIENTE
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: secret-alvaro-ulloa
              key: API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: svc-alvaro-ulloa
  namespace: ns-alvaro-ulloa
spec:
  type: ClusterIP
  selector:
    app: app-alvaro-ulloa
  ports:
  - port: 80
    targetPort: 3000
